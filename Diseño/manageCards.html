<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar tarjetas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.4.0/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/indexStyle.css">
    <link rel="stylesheet" href="css/index.css">
    <!--JQUERY-->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div class="container" id="columnaFormDiario">
        <h5>Tarjetas de comunicación por defecto</h5>
        <div class="container d-flex">
            <div class="row d-flex">
                <div class="col-md-2 card">
                    <img class="card-img" src="images/pictos/diario.png" alt="Diario digital">
                </div>
                <div class="col-md-2 card">
                    <img class="card-img" src="images/pictos/rutinas.png" alt="Diario digital">
                </div>
                <div class="col-md-2 card">
                    <img class="card-img" src="images/pictos/galletas.png" alt="Diario digital">
                </div>
                <div class="col-md-2 card">
                    <img class="card-img" src="images/pictos/recreo.png" alt="Diario digital">
                </div>
                <div class="col-md-2 card">
                    <img class="card-img" src="images/pictos/yo.png" alt="Diario digital">
                </div>
                <div class="col-md-2 card">
                    <img class="card-img" src="images/emotions/confusión.png" alt="Diario digital">
                </div>
                <div class="col-md-2 card">
                    <img class="card-img" src="images/emotions/enfadado.png" alt="Diario digital">
                </div>
                <div class="col-md-2 card">
                    <img class="card-img" src="images/emotions/triste.png" alt="Diario digital">
                </div>
            </div>
        </div>

        <h5>Tablero</h5>
        <div class="container d-flex mt-3" id="contenedorPictogramas"
            style="border: 2px solid black; border-radius: 3px;">
            <div class="row d-flex" id="rowPictogramas">
                <!-- Añade aquí las tarjetas del tablero -->
            </div>
        </div>
    </div>

    <script src="js/manageCardsTablero.js"></script>
</body>
</html>
