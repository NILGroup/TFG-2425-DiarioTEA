<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.4.0/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/indexStyle.css">
    <title>Añadir entrada</title>
</head>
<body>
    <div class="row justify-content-center d-flex align-items-center" id="scrollView">
        <div class="col-lg-3 col-md-2 col-sm-6 col-xs-12" id="columnaAddDiario">
            <div class="contanier d-flex flex-column justify-content-center align-items-center" id="addDiario">

                <button type="button" class="btn" id="addRegistro">
                    <div class="card">
                        <img class="card-img" src="images/add.png" alt="Add" style="max-height: 100px;">
                    </div>
                </button>
            </div>
        </div>
        <div class="col-lg-3 col-md-2 col-sm-6 col-xs-12" id="columnaGuardarDiario">
            <div class="contanier d-flex flex-column justify-content-center align-items-center" id="addDiario">
                <button type="button" class="btn" id="buttonSaveRegistro">
                    <div class="card">
                        <img class="card-img" src="images/add.png" alt="Add" style="max-height: 100px;">
                    </div>
                </button>
                <button type="button" class="btn" id="buttonDeleteRegistro">
                    <a href="diaryTEA.html">
                        <div class="card">

                            <img class="card-img" src="images/botonBorrar.png" alt="Add" style="max-height: 100px;">
                        </div>
                    </a>
                </button>
            </div>
        </div>

        <div class="col-lg-9 col-md-9 col-sm-6 col-xs-12 scroll-column mr-1" id="columnaFormDiario">

            <form>
                <div class="form-group">
                    <label for="fecha">Fecha</label>
                    <input type="date" class="form-control" id="fecha" name="fecha">
                </div>
                <div class="form-group">
                    <label for="hora">Hora</label>
                    <input type="time" class="form-control" id="hora" name="hora">
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="asociarRutina" name="asociarRutina">
                    <label class="form-check-label" for="asociarRutina">Asociar a una rutina</label>
                </div>
                <div id="selectRutinaContainer"></div>
            </form>


            <h5>Emociones</h5>
            <div class="container d-flex">
                <div class="card">
                    <img class="card-img" src="images/confusión.png" alt="Diario digital">
                </div>
                <div class="card">
                    <img class="card-img" src="images/enfadado.png" alt="Diario digital">
                </div>
                <div class="card">
                    <img class="card-img" src="images/triste.png" alt="Diario digital">
                </div>
            </div>
            <h5>Tarjetas de comunicación</h5>
            <div class="container d-flex">
                <div class="card">
                    <img class="card-img" src="images/diario.png" alt="Diario digital">
                </div>
                <div class="card">
                    <img class="card-img" src="images/rutinas.png" alt="Diario digital">
                </div>

                <div class="card">
                    <img class="card-img" src="images/galletas.png" alt="Diario digital">
                </div>
                <div class="card">
                    <img class="card-img" src="images/recreo.png" alt="Diario digital">
                </div>
                <div class="card">
                    <img class="card-img" src="images/yo.png" alt="Diario digital">
                </div>
            </div>


            <h5>Tablero</h5>
            <div class="container d-flex mt-3" id="contenedorPictogramas"
                style="border: 2px solid black; border-radius: 3px;">

            </div>
        </div>
    </div>

    <script src="/Diseño/js/addRegistros.js"></script>
</body>
</html>
